name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, mbstring, pdo_sqlite, sqlite3, zip, bcmath, exif, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan images:build
          npm run build

      - name: Tests
        run: php artisan test

      - name: Performance budget (page weight, JS, CSS)
        run: |
          php artisan serve --port=8010 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8010/up >/dev/null && break; sleep 1; done
          npm run budget

      - name: Lighthouse (mobile): Performance >= 90, LCP <= 2.5 s, CLS <= 0.05
        run: |
          npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
