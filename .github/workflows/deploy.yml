name: Deploy

# Vercel's own build machine has no PHP, so GitHub builds everything (images, CSS/JS, the read-only
# content database) and publishes it as the `release` branch. Vercel's Git connection deploys that branch.
# No Vercel token is needed.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, mbstring, pdo_sqlite, sqlite3, zip, bcmath, exif, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build (images, assets, read-only content database)
        run: |
          cp .env.example .env
          php artisan key:generate
          ./scripts/vercel-prepare.sh

      - name: Publish the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Vercel builds `release` itself, so turn its Git deploys back on there.
          python3 - <<'PY'
          import json
          d = json.load(open('vercel.json'))
          d.pop('git', None)
          json.dump(d, open('vercel.json', 'w'), indent=2)
          PY
          git checkout --orphan release
          git add -A
          git add -f public/build public/img database/deploy.sqlite
          git commit -q -m "Release ${GITHUB_SHA}"
          git push --force origin release
